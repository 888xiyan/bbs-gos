[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bbs-go-mcp"
version = "0.1.0"
description = "Local stdio MCP adapter for bbs-go articles and comments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0",
  "httpx>=0.27",
  "keyring>=25.0",
  "mcp>=2.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
]

[project.scripts]
bbs-go-mcp = "bbs_go_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bbs_go_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bbs_go_mcp"]
